<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esquina do Sabor - Finalizar Pedido</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <!-- Reaproveitamos a mesma estrutura de cabeçalho do menu.html -->
    <header class="topo">
        <div class="topo-marca">
            <img src="../../banco/imagens/logo.png" alt="Logo Esquina do Sabor" class="logo-topo">
            <span>Finalizar Pedido</span>
        </div>

        <a href="menu.html" class="btn-voltar">← Voltar ao Cardápio</a>
    </header>

    <main class="container-pagamento">
        <!-- Coluna 1: Resumo dos itens escolhidos na Home -->
        <section class="box-pagamento">
            <h2>Resumo do Pedido</h2>
            
            <!-- O JavaScript vai preencher essa lista automaticamente -->
            <ul id="listaResumo" class="lista-resumo"></ul>

            <div class="total-pedido">
                <span>Total a pagar:</span>
                <strong id="valorTotal">R$ 0,00</strong>
            </div>

            <button type="button" id="btnLimparCarrinho" class="btn-limpar">
                Esvaziar Carrinho
            </button>
        </section>

        <!-- Coluna 2: Formulário de Endereço + Pagamento -->
        <section class="box-pagamento">
            <h2>Entrega e Pagamento</h2>

            <form id="formPagamento">
                <div class="campo-grupo">
                    <label for="rua">Rua / Avenida:</label>
                    <input type="text" id="rua" placeholder="Ex: Rua das Flores" required>
                </div>

                <div class="linha-dupla">
                    <div class="campo-grupo">
                        <label for="numero">Número:</label>
                        <input type="text" id="numero" placeholder="Ex: 123" required>
                    </div>

                    <div class="campo-grupo">
                        <label for="bairro">Bairro:</label>
                        <input type="text" id="bairro" placeholder="Ex: Centro" required>
                    </div>
                </div>

                <div class="campo-grupo">
                    <label for="complemento">Complemento / Referência:</label>
                    <input type="text" id="complemento" placeholder="Ex: Apto 202, perto da praça">
                </div>

                <div class="campo-grupo">
                    <label for="formaPagamento">Forma de Pagamento:</label>
                    <select id="formaPagamento" required>
                        <option value="">Selecione...</option>
                        <option value="Pix">Pix</option>
                        <option value="Cartão de Crédito">Cartão de Crédito (na entrega)</option>
                        <option value="Cartão de Débito">Cartão de Débito (na entrega)</option>
                        <option value="Dinheiro">Dinheiro</option>
                    </select>
                </div>

                <div class="campo-grupo">
                    <label for="observacao">Observação ou Troco (opcional):</label>
                    <input type="text" id="observacao" placeholder="Ex: Troco para R$ 50,00 / Sem cebola">
                </div>

                <button type="submit" class="btn-finalizar">Confirmar Pedido</button>
            </form>
        </section>
    </main>

    <script src="../script.js"></script>
</body>
</html>
